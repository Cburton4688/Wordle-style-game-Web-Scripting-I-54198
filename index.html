<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Guess Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/word-game.css" />
</head>
<body>

  <div class="page-wrapper">

    <nav class="back-nav">
      <a href="index.html">&larr; Home</a>
    </nav>

    <header>
      <h1>WORDGAME</h1>
      <p class="subtitle">Guess the hidden 5-letter word in 6 tries.</p>
    </header>

    <main>
      <div id="board" class="board" aria-label="Game board"></div>
      <p id="status-message" class="status-message" aria-live="polite"></p>
      <button id="restart-btn" class="restart-btn">New Game</button>
    </main>

    <footer>
      <p>Type letters &nbsp;·&nbsp; <kbd>Enter</kbd> to submit &nbsp;·&nbsp; <kbd>⌫</kbd> to delete</p>
    </footer>

  </div>

  <script src="js/word-game.js"></script>
</body>
</html>
