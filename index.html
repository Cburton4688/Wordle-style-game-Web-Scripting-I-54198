<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Guess Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:            #0e0e0f;
      --surface:       #1a1a1d;
      --border:        #2e2e33;
      --text:          #e8e8e0;
      --muted:         #666670;
      --correct:       #3d8b5e;
      --present:       #b07d2a;
      --absent:        #2e2e33;
      --correct-text:  #a8ffcd;
      --present-text:  #ffd07a;
      --absent-text:   #888890;
      --accent:        #7b68ee;
      --tile-size:     62px;
      --gap:           6px;
      --radius:        4px;
      --font-mono:     'Space Mono', monospace;
      --font-display:  'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(255,255,255,0.012) 2px, rgba(255,255,255,0.012) 4px
      );
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 40px 20px;
      width: 100%;
      max-width: 480px;
    }

    header { text-align: center; }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 800;
      letter-spacing: 0.25em;
      background: linear-gradient(135deg, #e8e8e0 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }

    .subtitle { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; }

    main { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }

    .board {
      display: grid;
      grid-template-rows: repeat(6, var(--tile-size));
      grid-template-columns: repeat(5, var(--tile-size));
      gap: var(--gap);
    }

    .tile {
      width: var(--tile-size);
      height: var(--tile-size);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.1s ease, transform 0.08s ease;
      user-select: none;
    }

    .tile.filled  { border-color: #555560; transform: scale(1.04); }
    .tile.correct { background: var(--correct); border-color: var(--correct); color: var(--correct-text); box-shadow: 0 0 14px rgba(61,139,94,0.35); }
    .tile.present { background: var(--present); border-color: var(--present); color: var(--present-text); box-shadow: 0 0 14px rgba(176,125,42,0.35); }
    .tile.absent  { background: var(--absent);  border-color: var(--absent);  color: var(--absent-text); }

    @keyframes tile-pop   { 0% { transform: scale(1.04); } 50% { transform: scale(1.12); } 100% { transform: scale(1.04); } }
    @keyframes flip-out   { 0% { transform: rotateX(0deg); } 100% { transform: rotateX(-90deg); } }
    @keyframes flip-in    { 0% { transform: rotateX(-90deg); opacity: 0.6; } 100% { transform: rotateX(0deg); } }
    @keyframes row-shake  { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

    .tile.pop      { animation: tile-pop  0.1s   ease-out forwards; }
    .tile.flip-out { animation: flip-out  0.175s ease    forwards; }
    .tile.flip-in  { animation: flip-in   0.175s ease    forwards; }
    .row-shake     { animation: row-shake 0.35s  ease; }

    .status-message {
      min-height: 1.4em;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      transition: color 0.3s ease;
    }
    .status-message.win  { color: var(--correct-text); }
    .status-message.lose { color: #ff8080; }

    .restart-btn {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text);
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 28px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .restart-btn:hover  { border-color: var(--accent); color: #c0b8ff; box-shadow: 0 0 12px rgba(123,104,238,0.2); }
    .restart-btn:active { transform: scale(0.97); }
    .restart-btn.active {
      border-color: var(--accent);
      color: #c0b8ff;
      box-shadow: 0 0 16px rgba(123,104,238,0.35);
    }

    footer { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; text-align: center; }
    footer kbd { font-family: var(--font-mono); background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; font-size: 0.7rem; }

    @media (max-width: 380px) { :root { --tile-size: 52px; --gap: 5px; } }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header>
      <h1>WORDGAME</h1>
      <p class="subtitle">Guess the hidden 5-letter word in 6 tries.</p>
    </header>
    <main>
      <div id="board" class="board" aria-label="Game board"></div>
      <p id="status-message" class="status-message" aria-live="polite"></p>
      <button id="restart-btn" class="restart-btn">New Game</button>
    </main>
    <footer>
      <p>Type letters &nbsp;·&nbsp; <kbd>Enter</kbd> to submit &nbsp;·&nbsp; <kbd>⌫</kbd> to delete &nbsp;·&nbsp; press <kbd>Enter</kbd> or click New Game to play again</p>
    </footer>
  </div>

  <script>
    const WORDS = [
      "CRANE","SLATE","AUDIO","POINT","BLAZE","CRIMP","FROST","GLOOM","HARSH","INDEX",
      "JOUST","KNACK","LUNAR","MANOR","NYMPH","OPTIC","PLANK","QUOTA","RAVEN","SHAWL",
      "TAUNT","UMBRA","VIVID","WALTZ","XENON","YACHT","ZONED","BRISK","CLEFT","DELTA",
      "EMBER","FLAIR","GRAFT","HOIST","INGOT","LAPEL","MOURN","NOTCH","ONSET","PRISM",
      "QUIRK","RIVET","SWAMP","THYME","USURP","VENOM","WRUNG","YEARN","ZESTY","ABBEY",
      "BLUNT","CHASE","DROWN","EQUAL","FIEND","GOUGE","HAUNT","ICING","JERKY","KNEEL",
      "LIBEL","MOUND","NUDGE","OXIDE","PLUCK","REPEL","SCOUT","TROVE","ULCER","VOUCH",
      "WHIRL","EXPEL","YODEL","ZILCH","ABYSS","BROOD","CLAMP","DEBUT","EVOKE","FLINT",
      "GRIPE","HEIST","IRONY","KNAVE","LIGHT","MONTH","NERVE","OVOID","PLEAD","QUILL",
      "REACH","SNARE","TRAWL","UNIFY","VIGOR","WRATH","EXPAT","ZIPPY"
    ];

    const ROWS = 6, COLS = 5;
    let game = {};

    function pickRandomWord() { return WORDS[Math.floor(Math.random() * WORDS.length)]; }

    function initGame() {
      game = {
        targetWord: pickRandomWord(),
        currentRow: 0,
        currentCol: 0,
        guesses:  Array.from({ length: ROWS }, () => Array(COLS).fill("")),
        feedback: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
        state: "playing"
      };
    }

    function addLetter(letter) {
      if (game.state !== "playing" || game.currentCol >= COLS) return;
      game.guesses[game.currentRow][game.currentCol++] = letter;
    }

    function removeLetter() {
      if (game.state !== "playing" || game.currentCol <= 0) return;
      game.guesses[game.currentRow][--game.currentCol] = "";
    }

    function submitGuess() {
      if (game.state !== "playing" || game.currentCol < COLS) return false;
      const guessArr = game.guesses[game.currentRow];
      const targetArr = game.targetWord.split("");
      const result = Array(COLS).fill("absent");
      const remaining = [...targetArr];

      for (let i = 0; i < COLS; i++) {
        if (guessArr[i] === targetArr[i]) { result[i] = "correct"; remaining[i] = null; }
      }
      for (let i = 0; i < COLS; i++) {
        if (result[i] === "correct") continue;
        const idx = remaining.indexOf(guessArr[i]);
        if (idx !== -1) { result[i] = "present"; remaining[idx] = null; }
      }

      game.feedback[game.currentRow] = result;
      const guessWord = guessArr.join("");
      if (guessWord === game.targetWord)        game.state = "win";
      else if (game.currentRow === ROWS - 1)    game.state = "lose";
      else { game.currentRow++; game.currentCol = 0; }
      return true;
    }

    function getTile(r, c) { return document.querySelector(`.tile[data-row="${r}"][data-col="${c}"]`); }

    function renderBoard() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const tile = getTile(r, c);
          const letter = game.guesses[r][c];
          const fb = game.feedback[r][c];
          tile.textContent = letter;
          tile.classList.remove("filled","correct","present","absent","pop");
          if (fb) tile.classList.add(fb);
          else if (letter) tile.classList.add("filled");
        }
      }
    }

    function renderStatus() {
      const el = document.getElementById("status-message");
      el.classList.remove("win","lose");
      if (game.state === "win")       { el.textContent = "Nice — you got it!"; el.classList.add("win"); }
      else if (game.state === "lose") { el.textContent = `The word was ${game.targetWord}.`; el.classList.add("lose"); }
      else el.textContent = "";
    }

    function revealRow(row) {
      for (let c = 0; c < COLS; c++) {
        const fb = game.feedback[row][c];
        setTimeout(() => {
          const tile = getTile(row, c);
          tile.classList.remove("filled");
          tile.classList.add("flip-out");
          tile.addEventListener("animationend", () => {
            tile.classList.remove("flip-out");
            tile.classList.add(fb, "flip-in");
            tile.addEventListener("animationend", () => {
              tile.classList.remove("flip-in");
            }, { once: true });
          }, { once: true });
        }, c * 80);
      }
      // Status and button highlight after last tile finishes both halves
      const done = COLS * 80 + 350 + 50;
      setTimeout(renderStatus, done);
      setTimeout(() => {
        if (game.state !== "playing") {
          document.getElementById("restart-btn").classList.add("active");
        }
      }, done + 50);
    }

    function shakeRow(row) {
      for (let c = 0; c < COLS; c++) {
        const tile = getTile(row, c);
        tile.classList.add("row-shake");
        tile.addEventListener("animationend", () => tile.classList.remove("row-shake"), { once: true });
      }
    }

    function popTile(row, col) {
      const tile = getTile(row, col);
      tile.classList.remove("pop");
      void tile.offsetWidth;
      tile.classList.add("pop");
    }

    function buildBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) {
          const tile = document.createElement("div");
          tile.classList.add("tile");
          tile.dataset.row = r;
          tile.dataset.col = c;
          board.appendChild(tile);
        }
    }

    function restartGame() {
      initGame(); buildBoard(); renderBoard(); renderStatus();
      document.getElementById("restart-btn").classList.remove("active");
    }

    document.addEventListener("keydown", (e) => {
      if (game.state !== "playing") {
        if (e.key === "Enter") restartGame();
        return;
      }
      if (e.key === "Backspace") { removeLetter(); renderBoard(); return; }
      if (e.key === "Enter") {
        const prevRow = game.currentRow;
        if (!submitGuess()) { shakeRow(game.currentRow); return; }
        renderBoard();
        revealRow(prevRow);
        return;
      }
      if (/^[a-zA-Z]$/.test(e.key)) {
        const prevCol = game.currentCol;
        addLetter(e.key.toUpperCase());
        if (game.currentCol > prevCol) { renderBoard(); popTile(game.currentRow, prevCol); }
      }
    });

    document.getElementById("restart-btn").addEventListener("click", restartGame);

    initGame(); buildBoard(); renderBoard(); renderStatus();
  </script>
</body>
</html>
